{% if site.calendly_enabled %}
<!-- Calendly link widget begin -->
<link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
<script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript"></script>
<style>
/* Calendly's default popup is capped at 1000x700px, which makes it switch to the stacked (vertical) layout with a scrollbar.
   About 1200px wide keeps its two-column layout (details left, calendar right). */
@media (min-width: 976px) {
  .calendly-overlay .calendly-popup {
    max-width: 1200px !important;
    max-height: 900px !important;
    width: 94% !important;
    height: 94% !important;
  }
}
</style>
<!-- Calendly link widget end -->
{% endif %}
