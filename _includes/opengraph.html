<!-- OpenGraph -->
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}"/>
<meta property="og:title" content="{{ seo_title | escape }}"/>
<meta property="og:site_name" content="{{ site.title }}"/>
<meta property="og:locale" content="{{ site.locale | default: 'en_US' }}"/>
<meta property="og:description" content="{{ seo_description | escape }}"/>
<meta property="og:url" content="{{ canonical }}"/>
<meta property="og:image" content="{{ seo_image }}"/>
<meta property="og:image:alt" content="{{ seo_image_alt | escape }}"/>
{% if seo_image_path == site.default_image %}
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="628"/>
{% endif %}
{% if page.layout == 'post' %}
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}"/>
<meta property="article:modified_time" content="{{ seo_modified | date_to_xmlschema }}"/>
<meta property="article:author" content="{{ page.author.name | default: site.title }}"/>
{% for tag in page.tags limit: 6 %}
<meta property="article:tag" content="{{ tag | escape }}"/>
{% endfor %}
{% endif %}
