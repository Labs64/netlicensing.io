# Content of /trust/ (pages/trust.md). Publish only facts you can show evidence for.
# Select (extends Basic or Premium) and Enterprise are separate offerings.
# Page order: cards, answers, shared job, review request, then the detail `sections`,
# subprocessors and repositories. Update `reviewed` whenever you check the entries.
reviewed: 2026-11-27

# The four headline facts. icon = file name in img/features/.
cards:
  - { icon: "different_hosting_options", title: "Hosted in Ireland", text: "Managed hosting on AWS in the EU, run by Labs64 GmbH in Munich.", link: { label: "Processing locations", url: "#privacy" } }
  - { icon: "security_encryption", title: "Locked in Transit", text: "Encrypted connections, two-factor login and API keys limited by role.", link: { label: "Security measures", url: "#security" } }
  - { icon: "service_level_agreement", title: "99.5% Uptime", text: "Monthly, with service credits, for Select and Enterprise.", link: { label: "Read the SLA", url: "https://www.labs64.com/legal/terms-of-service/netlicensing/service-level-agreement-1-1/" } }
  - { icon: "escrow", title: "You Can Leave", text: "Export your data and have it deleted on request. Source code escrow with Enterprise.", link: { label: "How to export", url: "https://netlicensing.io/wiki/how-to-export-licensee-data" } }

# Questions in plain words; each answer links to its evidence.
answers:
  - { question: "Whose data is it?", answer: "Yours to decide about. For your customers' data you are the controller, and we process it on your instructions only.", link: { label: "Privacy Center", url: "https://netlicensing.io/wiki/privacy-center" } }
  - { question: "Can we sign a DPA?", answer: "Yes. Every vendor who asks gets a Data Processing Agreement under Article 28 GDPR, free of charge.", link: { label: "How to sign", url: "https://netlicensing.io/wiki/data-processing-agreement-dpa" } }
  - { question: "What if there is a data breach?", answer: "We tell you without undue delay, with the cause, the consequences and what we are doing about it.", link: { label: "DPA, article 6", url: "https://netlicensing.io/wiki/assets/docs/Labs64-NetLicensing-GDPR-DPA-V1.0_sample.pdf" } }
  - { question: "What if NetLicensing is unreachable?", answer: "Your application can keep using the last validation result until it expires.", link: { label: "How it works", url: "https://netlicensing.io/wiki/faq-service-unreachable" } }
  - { question: "Can we run it ourselves?", answer: "Self-hosting with Docker Compose or Kubernetes comes with Enterprise. The NetLicensing Agent validates offline, with Select and Enterprise.", link: { label: "NetLicensing Agent", url: "https://netlicensing.io/wiki/netlicensing-agent" } }
  - { question: "How can we assess your security?", answer: "Read the details below and send us your security questionnaire.", link: { label: "Contact us", url: "/contact/" } }

shared:
  ours:
    - "Hosting on AWS in Ireland"
    - "Encrypted web and API traffic"
    - "Regular backups"
    - "Telling you about data breaches"
    - "Signed validation responses, when you set them up"
  yours:
    - "A lawful basis for the customer data you send us"
    - "Telling your customers that we process it for you"
    - "Sending only what licensing needs"
    - "Keeping admin credentials on your servers"
    - "Turning on two-factor login"
    - "Reporting a breach to your authority where required, within 72 hours"

steps:
  - { icon: "licensing-as-a-service", title: "1. Ask for the DPA", text: "Send us your vendor number. We return the countersigned copy within 5 business days of receiving yours." }
  - { icon: "online_management_portal", title: "2. Send Your Questions", text: "Share your security questionnaire or the points your reviewers raised." }
  - { icon: "consulting_services", title: "3. Get Answers", text: "We answer and point you to the evidence." }

sections:
  - id: privacy
    title: "Data Protection and Privacy"
    items:
      - { topic: "Our two roles", text: "For the data of your customers (licensees) that you store in NetLicensing, you are the controller and Labs64 is your processor. For your own vendor account, such as sign-in, billing and support, Labs64 is the controller.", links: [{ label: "Privacy Center", url: "https://netlicensing.io/wiki/privacy-center" }, { label: "Labs64 privacy policy", url: "https://www.labs64.com/legal/privacy-policy/" }] }
      - { topic: "What we process for you", text: "Whatever your integration sends: typically a licensee number, and optionally names, email addresses and custom properties. Validation requests carry the IP address and system details. Shop purchases add billing details and a record of the accepted terms.", links: [{ label: "Privacy statement template", url: "https://netlicensing.io/wiki/privacy-statement-data-processing-by-netlicensing" }] }
      - { topic: "Use only on your instructions", text: "The DPA forbids us to use your customers' data for any purpose other than the one you specify (article 1).", links: [{ label: "Sample DPA (PDF)", url: "https://netlicensing.io/wiki/assets/docs/Labs64-NetLicensing-GDPR-DPA-V1.0_sample.pdf" }] }
      - { topic: "Requests from your customers", text: "Look up, correct, export and delete a customer's data yourself. If one of your customers contacts us directly, we pass the request on to you (DPA article 8).", links: [{ label: "Look up and correct", url: "https://netlicensing.io/wiki/how-to-access-and-update-licensee-data" }, { label: "Export", url: "https://netlicensing.io/wiki/how-to-export-licensee-data" }, { label: "Delete", url: "https://netlicensing.io/wiki/how-to-delete-licensee-data" }] }
      - { topic: "Ending your account", text: "On request we delete your account and the data it holds, except records we must keep by law, such as invoices.", links: [{ label: "Contact", url: "/contact/" }] }
      - { topic: "Processing locations", text: "Managed hosting runs on AWS in Ireland. The DPA also permits processing outside the EU where an adequate level of protection is ensured (article 3), and we name the countries on request.", links: [{ label: "Sample DPA (PDF)", url: "https://netlicensing.io/wiki/assets/docs/Labs64-NetLicensing-GDPR-DPA-V1.0_sample.pdf" }] }
      - { topic: "Audits", text: "The DPA sets out when you may have an independent third party audit our compliance with it (article 10).", links: [{ label: "Sample DPA (PDF)", url: "https://netlicensing.io/wiki/assets/docs/Labs64-NetLicensing-GDPR-DPA-V1.0_sample.pdf" }] }
      - { topic: "Supervisory authority", text: "The data protection authority responsible for Labs64 GmbH is the Bavarian State Office for Data Protection Supervision (BayLDA).", links: [{ label: "BayLDA", url: "https://www.lda.bayern.de/" }] }
  - id: security
    title: "Security"
    items:
      - { topic: "Encryption in transit", text: "Web and API traffic is encrypted with SSL/TLS.", links: [{ label: "API security", url: "https://netlicensing.io/wiki/security" }] }
      - { topic: "Vendor accounts", text: "Two-factor authentication is available.", links: [] }
      - { topic: "API keys", text: "Roles limit what each key can do. Ship only licensee-role keys inside your application.", links: [{ label: "Keys in client applications", url: "https://netlicensing.io/wiki/faq-api-key-in-client-application" }] }
      - { topic: "Signed validation responses", text: "Responses can be signed with your RSA key, so your application can detect a forged result. The Java and C# client libraries verify signatures.", links: [{ label: "Signing the response", url: "https://netlicensing.io/wiki/signing-the-response" }] }
      - { topic: "Single sign-on and audit log", text: "Enterprise: OpenID Connect sign-in, enabled per customer, and an audit log of admin changes.", links: [{ label: "Enterprise", url: "/enterprise/" }] }
      - { topic: "AI agents", text: "The MCP server masks secrets in tool results and asks for a confirmation step before deletes.", links: [{ label: "MCP security", url: "https://netlicensing.io/wiki/netlicensing-mcp-security" }] }
  - id: availability
    title: "Availability and Continuity"
    items:
      - { topic: "Service level agreement", text: "Select and Enterprise: 99.5% monthly uptime, with service credits if we fall short.", links: [{ label: "SLA", url: "https://www.labs64.com/legal/terms-of-service/netlicensing/service-level-agreement-1-1/" }] }
      - { topic: "Service status", text: "Current service status and updates.", links: [{ label: "status.netlicensing.io", url: "https://status.netlicensing.io" }] }
      - { topic: "Backups", text: "Data is stored and regularly backed up in Amazon data centers.", links: [] }
      - { topic: "If the service is unreachable", text: "Your application can keep using the last validation result until it expires.", links: [{ label: "What happens when unreachable", url: "https://netlicensing.io/wiki/faq-service-unreachable" }] }
      - { topic: "Your own copy of the configuration", text: "Export and re-import your product configuration.", links: [{ label: "Features", url: "/features-all/" }] }
      - { topic: "Self-hosting and offline use", text: "Self-hosting with Docker Compose or Kubernetes (Enterprise); offline validation with the NetLicensing Agent (Select and Enterprise).", links: [{ label: "Agent", url: "https://netlicensing.io/wiki/netlicensing-agent" }] }
      - { topic: "Source code escrow", text: "Available on request with Enterprise.", links: [{ label: "Enterprise", url: "/enterprise/" }] }

  - id: documents
    title: "Legal Documents"
    items:
      - { topic: "Terms of Service", text: "The contract for using NetLicensing.", links: [{ label: "Terms of Service", url: "https://www.labs64.com/legal/terms-of-service/netlicensing/" }] }
      - { topic: "Service Level Agreement", text: "Uptime commitment and service credits for Select and Enterprise.", links: [{ label: "SLA", url: "https://www.labs64.com/legal/terms-of-service/netlicensing/service-level-agreement-1-1/" }] }
      - { topic: "Data Processing Agreement", text: "Concluded on request; signed copies are returned within 5 business days.", links: [{ label: "How to sign", url: "https://netlicensing.io/wiki/data-processing-agreement-dpa" }, { label: "Sample DPA (PDF)", url: "https://netlicensing.io/wiki/assets/docs/Labs64-NetLicensing-GDPR-DPA-V1.0_sample.pdf" }] }
      - { topic: "Privacy and cookies", text: "How Labs64 handles personal data as a controller, and which cookies the websites use.", links: [{ label: "Privacy policy", url: "https://www.labs64.com/legal/privacy-policy/" }, { label: "Cookies policy", url: "https://www.labs64.com/legal/privacy-policy/cookies-policy/" }] }
      - { topic: "Company details", text: "Legal notice with registration details.", links: [{ label: "Imprint", url: "https://www.labs64.com/imprint/" }] }

# Third parties that handle personal data. Add a row only when confirmed.
subprocessors:
  - { name: "Amazon Web Services (AWS)", purpose: "Managed hosting, data storage and backups", location: "Ireland (EU)" }

# Payment providers: the vendor connects their own account to NetLicensing Shop.
payment_providers: ["PayPal", "Stripe"]

# Open-source components: advisories live in each repository's Security tab
# (https://github.com/Labs64/<repo>/security). Do not copy advisories here.
repositories:
  - component: "NetLicensing MCP Server"
    repos:
      - { label: "MCP Server", repo: "NetLicensing-MCP" }
  - component: "Client libraries"
    repos:
      - { label: "Java", repo: "NetLicensingClient-java" }
      - { label: "C#", repo: "NetLicensingClient-csharp" }
      - { label: "JavaScript", repo: "NetLicensingClient-javascript" }
      - { label: "Python", repo: "NetLicensingClient-python" }
      - { label: "PHP", repo: "NetLicensingClient-php" }
      - { label: "C++", repo: "NetLicensingClient-cpp" }
      - { label: "Kotlin", repo: "NetLicensingClient-kotlin" }
  - component: "API specification"
    repos:
      - { label: "NetLicensing API", repo: "NetLicensing-API" }
