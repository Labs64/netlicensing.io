- name: "Licensing-as-a-Service"
  description: "NetLicensing runs in the cloud, so there is no license server to install or maintain. <a href='https://ui.netlicensing.io/#/register'>Create a free account</a> and start licensing your first product right away."
  icon: "/img/features/licensing-as-a-service.png"
  show-default: true

- name: "Flexible Licensing Models"
  description: "Combine ready-to-use <a href='/licensing-models/'>licensing models</a> such as Subscription, Floating and Pay-per-Use in one product, or have a custom model built for you."
  icon: "/img/features/flexible_licensing_models.png"
  show-default: true

- name: "Easy Setup and Integration"
  description: "Three <a href='/getting-started/'>steps from account to first validation</a>: configure your product, validate a customer, sell licenses."
  icon: "/img/features/easy_setup_and_integration.png"
  show-default: true

- name: "Membership Management"
  description: "Model pricing plans with the Pricing Table licensing model and keep track of each customer's <a href='/membership-management/' title='Membership Management Solution'>memberships</a>, with features switched on or off per customer."
  icon: "/img/features/licensing-model-pricing-table.png"
  show-default: true

- name: "Online License Acquisition"
  description: "Customers buy licenses online in the NetLicensing Shop, and what they can buy follows the licensing models you configured."
  icon: "/img/features/online_license_acquisition.png"
  show-default: true

- name: "Integrated Payment Services"
  description: "NetLicensing Shop takes payments through PayPal and Stripe, straight into your own account. FastSpring and other checkouts connect through <a href='https://netlicensing.io/wiki/integrations'>integrations</a>."
  icon: "/img/features/integrated_payment_services.png"
  show-default: true

- name: "Availability"
  description: "A managed cloud service hosted on AWS in Ireland, with a 99.5% uptime SLA on Select and Enterprise. Current status: <a href='https://status.netlicensing.io'>status.netlicensing.io</a>."
  icon: "/img/features/availability.png"
  show-default: true

- name: "Cross-Platform Licensing"
  description: "A REST API over HTTPS and JSON, so any platform that can send a web request can use it: desktop, mobile, web, embedded and IoT."
  icon: "/img/features/cross_platform_licensing.png"
  show-default: true

- name: "Internet of Things (IoT) Licensing"
  description: "License connected devices and their features, including models where customers lease or rent rather than buy."
  icon: "/img/features/internet_of_things.png"

- name: "Virtualization Support"
  description: "License software in virtual machines and containers, for example with Node-Locked licenses tied to each VM's UUID. <a href='https://netlicensing.io/wiki/faq-docker-vm-environment'>How it works</a>."
  icon: "/img/features/virtualization_support.png"

- name: "Different Hosting Options"
  description: "<strong>Cloud</strong>: we run NetLicensing for you.<br/><strong>Dedicated or self-hosted</strong> (Enterprise): a dedicated environment that we operate, or your own installation with Docker Compose or Kubernetes."
  icon: "/img/features/different_hosting_options.png"

- name: "Product Usage Tracking and Analytics"
  description: "Product usage tracking and analytics show how your customers use your software."
  icon: "/img/features/product_usage_tracking_and_analytics.png"

- name: "Online Licenses Management Portal"
  description: "The NetLicensing Management Console is one place to manage all your products, product modules, license templates, customers and licenses."
  icon: "/img/features/online_management_portal.png"

- name: "Security Encryption"
  description: "All data transfer is encrypted, API keys are limited by role, and validation responses can be signed so your product can verify them."
  icon: "/img/features/security_encryption.png"

- name: "Predefined Client Libraries"
  description: "Open-source <a href='https://netlicensing.io/wiki/client-libraries'>client libraries</a> for Java, C#/.NET, PHP, JavaScript/Node.js, Kotlin and C++. Any other language can call the REST API directly."
  icon: "/img/features/predefined_client_libraries.png"

- name: "RESTful API and Integration"
  description: "Manage every licensing entity through the <a href='https://netlicensing.io/wiki/restful-api'>NetLicensing API</a> and connect it to your ERP, CRM, web shop or back office. The API is described in an <a href='https://netlicensing.io/wiki/faq-openapi-specification'>OpenAPI specification</a>."
  icon: "/img/features/restful_api_and_integration.png"

- name: "Licensing eCommerce Platform"
  description: "NetLicensing Shop lets customers buy licenses for every licensing model you offer, with EU VAT support from the Basic plan."
  icon: "/img/features/licensing_ecommerce_platform.png"

- name: "Consulting Services"
  description: "Support and tutoring at every stage of licensing your product, from the first setup to the rollout."
  icon: "/img/features/consulting_services.png"

- name: "Escrow (Enterprise)"
  description: "On request, our source code is deposited with a third-party escrow agent for additional safety."
  icon: "/img/features/escrow.png"

- name: "Service Level Agreement (Enterprise)"
  description: "A contractual commitment of 99.5% monthly uptime, with service credits if we fall short. <a href='https://www.labs64.com/legal/terms-of-service/netlicensing/service-level-agreement-1-1/'>Read the SLA</a>."
  icon: "/img/features/service_level_agreement.png"

- name: "NetLicensing Enterprise (Enterprise)"
  description: "Self-hosted or dedicated deployment, single sign-on, an audit log and a technical manager for your rollout. <a href='/enterprise/'>NetLicensing Enterprise</a>."
  icon: "/img/features/netlicensing_enterprise.png"
