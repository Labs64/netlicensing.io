# Licensing models shown on /licensing-models/ and used by the plan picker on /pricing/.
#
# plans: the fixed plans that include the model (free, basic, premium).
#   Select includes every model, so it is not listed.
#   An empty list means the model is available in Select only.
#   The pricing table's "Licensing Models" row is built from these lists: a model
#   appears in the column of its first plan, so list every plan from there upwards.
# summary: one line shown next to the model in the plan picker on /pricing/.
# picker: set to false to leave a model out of the plan picker (e.g. models derived from others).

- name: "Try & Buy"
  aliases:
   - Evaluation
   - Demo
   - Trialware
   - Functional-limited demo version
   - Time Limited Evaluation
  summary: "Time-limited trial or demo before the customer buys"
  description: "Every new customer gets a time-limited free evaluation that starts on first use. After purchase, the full product unlocks."
  tags:
   - time
   - feature
  status: "AVAILABLE"
  img: '/img/licensing-model/licensing-model-try-and-buy.png'
  url: "https://netlicensing.io/wiki/try-n-buy"
  plans: [free, basic, premium]

- name: "Subscription"
  aliases:
   - ABO
   - Time-limited
   - Time-Based
   - TimeVolume
  summary: "Access for a period, with renewal and auto-renewal"
  description: "Customers use the product for the period they paid for, and each renewal extends it. Offer several periods at different prices, an evaluation period and a grace period."
  tags:
   - time
  status: "AVAILABLE"
  img: '/img/licensing-model/licensing-model-subscription.png'
  url: "https://netlicensing.io/wiki/subscription"
  plans: [free, basic, premium]

- name: "Discount"
  aliases:
   - Promo code
   - Coupon
  summary: "Fixed or percentage discount at checkout, with promo codes"
  description: "Fixed-amount or percentage discounts in NetLicensing Shop, with an optional promo code, validity period and minimum cart total."
  tags: []
  status: "AVAILABLE"
  img: '/img/licensing-model/licensing-model-discount.png'
  url: "https://netlicensing.io/wiki/discount"
  plans: [free, basic, premium]

- name: "Multi-Feature"
  aliases:
    - Pay-per-feature
    - Feature-based
    - Modular
    - Multi-Module
  summary: "Switch product features on or off per customer"
  description: "Sell and switch on individual product features, or build lite, pro and enterprise editions of one product. The validation response tells your product which features are on."
  tags:
    - feature
  status: "AVAILABLE"
  img: '/img/licensing-model/licensing-model-multi-feature.png'
  url: "https://netlicensing.io/wiki/multi-feature"
  plans: [basic, premium]

- name: "Floating"
  aliases:
    - Concurrent
    - Network
    - Shared
  summary: "A set number of concurrent sessions"
  description: "Limit how many sessions, users or hosts run your application at the same time. Sessions are checked out and checked in on validation."
  tags:
    - concurrent
  status: "AVAILABLE"
  img: '/img/licensing-model/licensing-model-floating.png'
  url: "https://netlicensing.io/wiki/floating"
  plans: [premium]

- name: "Node-Locked"
  aliases:
    - Named host
    - Local
  summary: "Tied to one or more named computers"
  description: "Bind a license to one or more devices or users through a node secret that your product sends, such as a hash of hardware data. A quota sets how many nodes each license allows."
  tags:
    - volume
    - feature
    - user
  status: "AVAILABLE"
  img: '/img/licensing-model/licensing-model-node-locked.png'
  url: "https://netlicensing.io/wiki/node-locked"
  plans: [premium]

- name: "Pricing Table"
  aliases:
   - Pricing Plan
   - Pricing Model
   - Membership Plan
   - Membership Management
   - SaaS Subscription
  summary: "Plans and features per customer, with memberships"
  description: "Define plans such as free, basic and premium, with billing intervals, trials and freemium, then validate which plan each customer is on. Also covers <a href='/membership-management/' title='Membership Management Solution'>memberships</a>."
  tags:
   - time
   - feature
   - volume
  status: "AVAILABLE"
  img: '/img/licensing-model/licensing-model-pricing-table.png'
  url: "https://netlicensing.io/wiki/pricing-table"
  plans: [basic, premium]

- name: "Pay-per-Use"
  aliases:
   - Pre-paid
   - Post-paid
   - Pay-per-click
  summary: "Fees based on actual usage: time, count or volume"
  description: "Customers buy credits, and your application reports usage or reserves credits on validation. NetLicensing tracks the remaining quantity, so you can bill by time, count or volume."
  tags:
   - volume
  status: "AVAILABLE"
  img: '/img/licensing-model/licensing-model-pay-per-use.png'
  url: "https://netlicensing.io/wiki/pay-per-use"
  plans: [premium]

- name: "Quota"
  aliases:
   - Limit
   - Capacity
   - Quantity
   - Volume
  summary: "Capacity limits for a feature, such as units or requests"
  description: "License a capacity limit for a feature, such as users, documents, storage or requests per day. Quotas from several licenses add up."
  tags:
   - volume
   - feature
  status: "AVAILABLE"
  img: '/img/licensing-model/licensing-model-quota.png'
  url: "https://netlicensing.io/wiki/quota"
  plans: [basic, premium]

- name: "Rental"
  aliases:
    - Leasing
    - Feature with TimeVolume
  summary: "Many instances, each licensed for its own period"
  description: "License many instances of a feature, such as devices, each for its own time period, with renewals at different prices."
  tags:
    - time
    - feature
  status: "AVAILABLE"
  img: '/img/licensing-model/licensing-model-rental.png'
  url: "https://netlicensing.io/wiki/rental"
  plans: []

- name: "Named User"
  aliases:
   - Personal License
  summary: "Rights granted to specific user IDs"
  description: "License rights are granted to specific user IDs. A listed user can use the software on any computer."
  tags:
   - user
  status: "AVAILABLE"
  img: '/img/licensing-model/licensing-model-named-user.png'
  url: "https://netlicensing.io/wiki/licensing-models"
  plans: []
  picker: false

- name: "Standard"
  aliases:
    - Permanent
    - Single-user
    - Perpetual
  summary: "Perpetual license for a single user or computer"
  description: "A perpetual license for a single computer or user. Once bought, the product can be used without a time limit."
  tags:
    - user
  status: "AVAILABLE"
  img: '/img/licensing-model/licensing-model-standard.png'
  url: "https://netlicensing.io/wiki/licensing-models"
  plans: []
  picker: false
